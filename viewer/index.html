<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Document</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/viewer.css" />
  </head>
  <body>
    <header class="bar">
      <h1 class="name" id="name">Loading document&hellip;</h1>
      <span class="pages" id="pages" aria-live="polite"></span>
      <div class="tools">
        <button type="button" class="tool" id="zoom-out" aria-label="Zoom out" disabled>&minus;</button>
        <button type="button" class="tool fit" id="zoom-fit" aria-label="Fit to width" disabled>Fit</button>
        <button type="button" class="tool" id="zoom-in" aria-label="Zoom in" disabled>+</button>
        <a class="download" id="download" hidden>Download</a>
      </div>
    </header>
    <main class="doc" id="doc" tabindex="-1">
      <p class="status" id="status" role="status">Loading&hellip;</p>
      <div class="sheets" id="sheets"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
